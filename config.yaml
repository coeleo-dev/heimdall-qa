# Harness infrastructure only. The project — origins, auth, routing, budgets, log
# sources, request sources — is declared in qa/project.yaml, and `--descriptor`
# overrides that for a single run.
ui:
  host: 127.0.0.1
  port: 7878
probes:
  ingest_poll_ms: 8000
  ledger_ms: 8000
  overview_ms: 30000
# The floor between two requests whose route declares a `pace_key`. The key
# itself is product data and lives in qa/project.yaml.
pace_gap_ms: 2000
