# Disposable study prototype (F3). Not production code, not shipped.
#
# A hand-written OpenAPI 3.1 document for `POST /api/ingest`, modelled on what
# Springdoc WOULD emit from `com.nokr.domain.metering.ingest.dto.IngestRequest`.
# The point is to have something schema-true to generate from, so the
# derivability matrix in 03-auto-discovery.md is measured instead of asserted.
#
# Note: NokrAPI has no springdoc dependency today (verified in pom.xml), so this
# document does not exist in the product. Producing it is a target-side change.
openapi: 3.1.0
info:
  title: Nokr Ingest (study fragment)
  version: "0"
paths:
  /api/ingest:
    post:
      operationId: ingest
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "202":
          description: Accepted
        "400":
          description: Validation error
        "404":
          description: Customer not found
        "422":
          description: Unprocessable
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
  schemas:
    IngestRequest:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - customer_id
        - event_type
        - timestamp
        - properties
      properties:
        transaction_id:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
        customer_id:
          type: string
          maxLength: 128
        event_type:
          type: string
          maxLength: 64
          pattern: "^[a-z][a-z0-9_]*$"
        timestamp:
          type: string
          format: date-time
        properties:
          type: object
          maxProperties: 32
          additionalProperties:
            type: number
