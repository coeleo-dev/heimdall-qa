id: ui-overview
suite: suites/ui-smoke.yaml
mode: headless
environment: sandbox
notes: 'E2/E3 acceptance. The runner opens Chromium, logs in through the real form,
  reads /overview, then navigates in-app to /customers. Every request the browser makes
  carries X-Trace-Id = nokrqa-ui-overview-N, so logs-web.txt of each step must contain
  lines with the very same trace_id. E3 adds the structural verdicts on top: ui.render
  fails on a console error or an observed 5xx, ui.structure compares the /overview ARIA
  tree against baselines/ui/overview.aria.yml, and ui.a11y runs axe-core (WCAG A/AA)
  scoped to the read region. Needs the dashboard on localhost:4200 and the JVM logs
  wired in config.yaml.'
include: []
