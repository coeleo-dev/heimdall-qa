# Copy this to `secrets.local.yaml` and fill in what the API asks for.
#
# `secrets.local.yaml` is gitignored and is the only place a credential lives. A
# project that needs none keeps no file at all: an absent `secrets.local.yaml` means
# the empty map, which is what the fixtures run with.
#
# The keys are read by the descriptor's `auth` blocks, so the names below are the
# convention and not a schema — a descriptor that says `header: X-Api-Key` and
# `prefix: api_key` is served by whatever key you write here.
#
# api_key: ""
# jwt: ""
# admin_secret: ""
