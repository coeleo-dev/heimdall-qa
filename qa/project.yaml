# Project descriptor for the NokrAPI HTTP surface.
#
# This file is the destination of everything that used to be a product literal in
# the harness: URLs, auth headers, routing policy, trace and log sources. It is
# a faithful translation of `config.yaml` (which keeps only harness
# infrastructure) plus the facts the runner hardcoded, so fase 1.4 can move them
# here one by one without changing a single case result.
#
# Design: docs/estudo-heimdall/02-descriptor-projeto.md

version: 1

project:
  id: nokr
  name: Nokr

environments:
  # Both profiles are the same local origin on purpose: today `config.yaml` has a
  # single `nokr_web`, and the logical environment is selected by the
  # `X-Nokr-Environment` header, not by the host (constitution §2).
  sandbox:
    base_url: http://127.0.0.1:8080
  production:
    base_url: http://127.0.0.1:8080

auth:
  jwt:
    header: Authorization
    scheme: bearer
  api_key:
    header: Authorization
    scheme: bearer
    # The credential shape is product data (V6), so it is declared, not inferred.
    prefixes:
      sandbox: "nk_test_"
      production: "nk_live_"
  admin:
    header: X-Nokr-Admin-Secret
    scheme: raw
  # Inbound provider callbacks. The product names this header in
  # `WebhookSigner`; the harness only needs to know which routes may not carry a
  # tenant Bearer.
  hmac:
    header: X-Nokr-Signature
    scheme: hmac

environment_header:
  name: X-Nokr-Environment
  values:
    sandbox: sandbox
    production: production

# Longest prefix wins. Before 1.4 this table is documentation; the runner still
# decides by string matching in `_budget_for` and `_require_worker_logs`.
routes:
  - prefix: /platform/
    auth: jwt
    require_environment_header: true
  - prefix: /admin/
    auth: admin
  - prefix: /api/ingest
    auth: api_key
    budget: fast
    async: true
  - prefix: /api/metering
    auth: api_key
    budget: fast
  - prefix: /api/
    auth: api_key
  - prefix: /auth/
    auth: none
    budget: long
  - prefix: /webhooks/
    auth: hmac

budgets:
  fast:
    budget: 50
    fail: 1500
  default:
    budget: 1500
    fail: 1500
  long:
    budget: 8000
    fail: 8000

errors:
  validation_status: 422
  envelope: spring
  product_packages:
    - com.nokr
  redact:
    - "nk_test_*"
    - "nk_live_*"

trace:
  header: X-Trace-Id
  prefix: "heimdall-"
  propagate_to_worker: true

# Paths are relative to the run root. `../NokrAPI/...` is where the two JVMs write
# today; the defaults used to live in `config.py` as `LogFiles`.
log_sources:
  - id: web
    path: ../NokrAPI/logs/nokr-web.log
    format: logback
    marker: 'trace_id: \[{trace_id}\]'
  - id: worker
    path: ../NokrAPI/logs/nokr-worker.log
    format: logback
    marker: 'trace_id: \[{trace_id}\]'
    async: true
  - id: admin
    path: ../NokrAPI/logs/nokr-admin.log
    format: logback
    marker: 'trace_id: \[{trace_id}\]'

contract:
  source: openapi
  location: http://127.0.0.1:8080/v3/api-docs

fixtures:
  locale: pt_BR
  email_domain: qa.nokr.dev
  generators:
    cpf:
      kind: validate_docbr_cpf
    cnpj:
      kind: validate_docbr_cnpj
  field_kinds:
    document_number: cnpj
    tax_id: cnpj

targets:
  admin:
    base_url: http://127.0.0.1:9090

request_source:
  kind: bru
  collection: /home/davi/Documentos/bruno/Nokr API - Dev Collection

# References only (P3). The values live in `secrets.local.yaml`, which is
# gitignored; `secrets.example.yaml` documents the keys.
secrets:
  api_key:
    from_file: secrets.local.yaml
    key: api_key
  jwt:
    from_file: secrets.local.yaml
    key: jwt
  admin_secret:
    from_file: secrets.local.yaml
    key: admin_secret
