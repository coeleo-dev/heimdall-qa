id: fuzz-path-traversal
contract: contracts/api-users-get.yaml
kind: N-fuzz-traversal
gate: auto
tags:
  - security
diff: {}
path_values:
  external_user_id: "..%2F..%2F..%2F..%2Fetc%2Fpasswd"
headers:
  Authorization: Bearer {{api_key}}
expect:
  status: 400
waive:
  - pack: http.baseline
    reason: "Container-level path traversal rejection by Tomcat does not include X-Trace-Id header"
  - pack: http.error
    reason: "Container-level path traversal rejection by Tomcat returns HTML 400 response body"
  - pack: observability
    reason: "Container-level path traversal rejection by Tomcat drops X-Trace-Id request logging"
