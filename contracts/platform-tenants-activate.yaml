endpoint: POST /platform/tenants/activate
dto: com.nokr.domain.tenant.dto.ActivateProductionRequest
auth: jwt
area: tenants-activate
baseline: baselines/tenants-activate.json
fields:
  name:
    required: true
    json: name
  email:
    required: true
    json: email
  cpf_cnpj:
    required: true
    json: cpf_cnpj
  mobile_phone:
    required: true
    json: mobile_phone
  income_value:
    required: true
    json: income_value
  address:
    required: true
    json: address
  address_number:
    required: true
    json: address_number
  province:
    required: true
    json: province
  postal_code:
    required: true
    json: postal_code
  birth_date:
    required: false
    json: birth_date
    example: '2000-01-01'
  company_type:
    required: true
    json: company_type
  tier:
    required: false
    json: tier
    example: DEVELOPER
  accepted_terms:
    required: false
    json: accepted_terms
    example: true
rules:
- id: CPF_FORBIDDEN
  status: 400
  error: Production activation requires a valid CNPJ
- id: INCOME_ZERO
  status: 400
  error: must be greater than 0
  set:
    income_value: 0
idempotency: none
async: sync
live_only_rules: []
p_gaps: []
