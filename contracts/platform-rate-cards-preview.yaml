endpoint: POST /platform/rate-cards/preview
dto: com.nokr.domain.metering.rating.dto.PreviewRateCardRequest
auth: jwt
area: rate-cards-preview
baseline: baselines/rate-cards-preview.json
fields:
  pricing_model:
    required: true
    json: pricing_model
    pattern: ^(FLAT|TIERED|VOLUME)$
  dimension_keys:
    required: true
    json: dimension_keys
  tiers:
    required: true
    json: tiers
  quantity:
    required: true
    json: quantity
  previous_volume:
    required: false
    json: previous_volume
    example: '0'
rules:
- id: QUANTITY_NOT_DECIMAL
  status: 422
  error: must be a decimal string
  set:
    quantity: abc
idempotency: none
async: sync
live_only_rules: []
p_gaps: []
