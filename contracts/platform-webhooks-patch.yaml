endpoint: PATCH /platform/webhooks/{{webhook_id}}
dto: com.nokr.domain.notification.outbound.dto.UpdateWebhookRequest
auth: jwt
area: webhooks-patch
resource_id_in_path: true
baseline: baselines/webhooks-patch.json
fields:
  url:
    required: false
    json: url
    example: https://webhook.site/nokr-qa-renamed
  name:
    required: false
    json: name
    example: renamed
  events:
    required: false
    json: events
    example:
    - rating.insufficient
  active:
    required: false
    json: active
    example: true
idempotency: none
async: sync
rules: []
live_only_rules: []
p_gaps: []
