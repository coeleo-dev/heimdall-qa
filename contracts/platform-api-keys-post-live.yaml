endpoint: POST /platform/api-keys
dto: com.nokr.domain.auth.dto.CreateApiKeyRequest
auth: jwt
area: api-keys-post
baseline: baselines/api-keys-post.json
fields:
  name:
    required: true
    json: name
    max_length: 50
    example: abc
  environment:
    required: true
    json: environment
    pattern: ^(SANDBOX|PRODUCTION)$
rules:
- id: NAME_TOO_SHORT
  status: 400
  error: size must be between
  set:
    name: ab
- id: SANDBOX_LIMIT
  status: 409
  error: already have
  saturate:
    until_status: 409
    max: 6
    unique_json: name
idempotency: none
async: sync
live_only_rules: []
p_gaps: []
