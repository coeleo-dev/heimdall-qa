endpoint: POST /platform/webhooks
dto: com.nokr.domain.notification.outbound.dto.CreateWebhookRequest
auth: jwt
area: webhooks-post
captures:
  webhook_id: id
unique_json: name
baseline: baselines/webhooks-post.json
fields:
  url:
    required: true
    json: url
    pattern: ^https?://.*$
  name:
    required: false
    json: name
    max_length: 100
    example: lab-hook
  events:
    required: true
    json: events
rules:
- id: EVENTS_EMPTY
  status: 400
  error: At least one event type is required
  set:
    events: []
- id: MAX_ACTIVE
  status: 409
  error: active webhooks per environment
  saturate:
    until_status: 409
    max: 6
    unique_json: name
idempotency: none
async: sync
live_only_rules: []
p_gaps: []
