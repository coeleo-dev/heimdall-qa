endpoint: POST /platform/rate-cards
dto: com.nokr.domain.metering.rating.dto.CreateRateCardRequest
auth: jwt
idempotency: header_uuid_v4
area: rate-cards-post
captures:
  rate_card_id: id
unique_json: name
baseline: baselines/rate-cards-post.json
fields:
  billable_metric_id:
    required: true
    json: billable_metric_id
  name:
    required: true
    json: name
    max_length: 128
  pricing_model:
    required: true
    json: pricing_model
    pattern: ^(FLAT|TIERED|VOLUME)$
  dimension_keys:
    required: true
    json: dimension_keys
    max_keys: 8
  cost_driver_note:
    required: true
    json: cost_driver_note
  active_from:
    required: true
    json: active_from
  active_until:
    required: false
    json: active_until
    example: '2027-09-01T00:00:00Z'
  reason:
    required: true
    json: reason
  tiers:
    required: true
    json: tiers
rules:
- id: FLAT_TWO_TIERS
  status: 422
  error: FLAT requires exactly one tier
  set:
    tiers:
    - unit_amount: '0.00003'
      priority: 0
      dimensions:
        model: gpt-4o
    - unit_amount: '0.00004'
      priority: 0
      dimensions:
        model: gpt-4o
- id: FLAT_UP_TO
  status: 422
  error: FLAT tier up_to_amount must be null
  set:
    tiers:
    - unit_amount: '0.00003'
      up_to_amount: 100
      priority: 0
      dimensions:
        model: gpt-4o
- id: UNTIL_BEFORE_FROM
  status: 422
  error: active_until must be after active_from
  set:
    active_until: '2020-01-01T00:00:00Z'
- id: FORBIDDEN_DIMENSION
  status: 422
  error: forbidden dimension key
  set:
    dimension_keys:
    - customer_id
- id: METRIC_NOT_FOUND
  status: 404
  error: Billable metric not found
  set:
    billable_metric_id: 00000000-0000-4000-8000-000000000099
- id: OVERLAP
  status: 422
  code: RATE_CARD_OVERLAP
- id: METRIC_NOT_ACTIVE
  status: 422
  code: METRIC_NOT_ACTIVE
  set:
    billable_metric_id: '{{archived_metric_id}}'
async: sync
live_only_rules: []
p_gaps: []
