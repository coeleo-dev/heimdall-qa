endpoint: POST /auth/login
dto: com.nokr.domain.auth.dto.LoginRequest
auth: none
area: login
baseline: baselines/auth-login.json
fields:
  email:
    required: true
    json: email
  password:
    required: true
    json: password
rules:
- id: INVALID_CREDENTIALS
  status: 401
  error: Invalid credentials
  set:
    password: wrong-password
- id: LOCKED
  status: 401
  error: Invalid credentials
  burst: 5
idempotency: none
async: sync
live_only_rules: []
p_gaps:
- P-GAP-8
