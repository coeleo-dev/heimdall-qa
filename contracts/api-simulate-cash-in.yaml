endpoint: POST /api/sandbox/simulate-cash-in
dto: com.nokr.domain.sandbox.simulation.controller.SandboxSimulationController
auth: api_key
area: simulate-cash-in
baseline: baselines/simulate-cash-in.json
p_gaps:
- P-GAP-1
fields:
  nokr_user_id:
    required: true
    json: nokr_user_id
  amount:
    required: true
    json: amount
rules:
- id: MIN_DEPOSIT
  status: 422
  error: Minimum deposit is R$ 1.00
  set:
    amount: 0.99
- id: AMOUNT_NOT_NUMBER
  status: 422
  error: amount must be a valid number
  set:
    amount: x
kind_expect:
  N-omit-nokr_user_id: 422
  N-omit-amount: 422
idempotency: none
async: sync
live_only_rules: []
