endpoint: POST /api/sandbox/simulate-cash-out
dto: com.nokr.domain.sandbox.simulation.controller.SandboxSimulationController
auth: api_key
area: simulate-cash-out
baseline: baselines/simulate-cash-out.json
fields:
  nokr_user_id:
    required: true
    json: nokr_user_id
  amount:
    required: true
    json: amount
rules:
- id: INSUFFICIENT
  status: 422
  error: Insufficient balance
  set:
    amount: 999999.00
kind_expect:
  N-omit-nokr_user_id: 422
  N-omit-amount: 422
idempotency: none
async: sync
live_only_rules: []
p_gaps: []
