endpoint: POST /api/ingest/preview
dto: com.nokr.domain.metering.ingest.dto.IngestRequest
auth: api_key
area: ingest-preview
baseline: baselines/ingest-preview.json
p_gaps:
- P-GAP-7
fields:
  transaction_id:
    required: true
    json: transaction_id
    max_length: 128
    pattern: ^[A-Za-z0-9._:-]+$
  customer_id:
    required: true
    json: customer_id
    max_length: 128
  event_type:
    required: true
    json: event_type
    max_length: 64
    pattern: ^[a-z][a-z0-9_]*$
  timestamp:
    required: true
    json: timestamp
  properties:
    required: true
    json: properties
rules:
- id: UNKNOWN_EVENT_TYPE
  status: 422
  code: UNKNOWN_EVENT_TYPE
  set:
    event_type: not_in_catalog
idempotency: none
async: sync
live_only_rules: []
