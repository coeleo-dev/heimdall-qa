endpoint: POST /api/entitlements/check
dto: com.nokr.domain.entitlements.dto.EntitlementCheckRequest
auth: api_key
area: entitlements-check
baseline: baselines/entitlements-check.json
p_gaps:
- P-GAP-3
fields:
  userId:
    required: true
    json: userId
  featureKey:
    required: true
    json: featureKey
  context:
    required: false
    json: context
    example:
      model: gpt-4o
rules:
- id: SNAKE_CASE
  status: 400
  error: must not
  omit:
  - userId
  - featureKey
  set:
    user_id: '{{nokr_user_id}}'
    feature_key: '{{feature_key}}'
- id: OTHER_TENANT
  status: 403
  error: User does not belong to this tenant
  set:
    userId: '{{other_nokr_user_id}}'
idempotency: none
async: sync
live_only_rules: []
