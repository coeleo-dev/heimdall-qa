endpoint: POST /api/entitlements/check/bulk
dto: com.nokr.domain.entitlements.dto.EntitlementBulkCheckRequest
auth: api_key
area: entitlements-check-bulk
baseline: baselines/entitlements-check-bulk.json
p_gaps:
- P-GAP-3
fields:
  userId:
    required: true
    json: userId
  checks:
    required: true
    json: checks
rules:
- id: CHECKS_EMPTY
  status: 400
  error: must not be empty
  set:
    checks: []
- id: OTHER_TENANT
  status: 403
  error: User does not belong to this tenant
  set:
    userId: '{{other_nokr_user_id}}'
idempotency: none
async: sync
live_only_rules: []
