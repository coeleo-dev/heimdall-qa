endpoint: PATCH /platform/tenants/settings
dto: com.nokr.domain.tenant.dto.TenantSettingsRequest
auth: jwt
area: tenants-settings
baseline: baselines/tenants-settings.json
fields:
  webhook_url:
    required: false
    json: webhook_url
    pattern: ^https://.*$
    example: https://example.com/h
  test_drive_enabled:
    required: false
    json: test_drive_enabled
    example: false
  test_drive_credits:
    required: false
    json: test_drive_credits
    example: 4.0
rules:
- id: CREDITS_BELOW_MIN
  status: 400
  error: Test-Drive credits must be at least
  set:
    test_drive_credits: 0.99999
- id: CREDITS_ABOVE_BV
  status: 400
  error: Test-Drive credits must be at most
  set:
    test_drive_credits: 20.00001
- id: CREDITS_ABOVE_TIER
  status: 422
  error: test_drive_credits exceeds maximum
  set:
    test_drive_credits: 5.00001
- id: WEBHOOK_HTTP
  status: 400
  error: Webhook URL must use HTTPS
  set:
    webhook_url: http://x.com/h
idempotency: none
async: sync
live_only_rules: []
p_gaps: []
