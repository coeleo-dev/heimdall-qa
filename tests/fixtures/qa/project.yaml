# Level 2 — a Spring API, reduced to the essentials.
#
# Note that `X-Environment` and `test_key_` survive: generalising the harness is not
# deleting a product's identity, it is moving that identity out of the core and into
# a file the product's own team reviews.
#
# It mirrors the parts of a real descriptor the harness's own suite exercises:
# routing by prefix, both credentials, the admin origin, declared log sources and
# the markers `security.leak` looks for. Tests that need a *different* answer
# override it here (a second descriptor file) rather than in the core.
version: 1

project:
  id: demo
  name: Demo API

# A provider id is a *declared* string: the descriptor says whose price model a probe
# should ask for, and resolving it is the run's business — a project can be configured
# before its provider is installed, which is why the core's own fixture names an id no
# distribution here provides. The tests that check a price model live in the suite of
# whoever owns that price model, and they bring their own descriptor to say so.
provider: reference

environments:
  sandbox:
    base_url: http://127.0.0.1:8080
  production:
    base_url: https://api.example.com

auth:
  jwt:
    header: Authorization
    scheme: bearer
  api_key:
    header: Authorization
    scheme: bearer
    prefixes:
      sandbox: "test_key_"
      production: "live_key_"
  admin:
    header: X-Admin-Secret
    scheme: raw

environment_header:
  name: X-Environment
  values:
    sandbox: sandbox
    production: production
  # Which namespace `E-isolate` and `E-conflict` collide with.
  isolation: production

routes:
  - prefix: /platform/
    auth: jwt
    require_environment_header: true
  - prefix: /admin/
    auth: admin
    target: admin
  - prefix: /api/ingest
    auth: api_key
    budget: fast
    async: true
  - prefix: /api/metering
    auth: api_key
    budget: fast
  - prefix: /auth/register
    auth: none
    budget: long
    pace_key: register
  - prefix: /auth/
    auth: none
    budget: long
  # A POST here creates a resource the API refuses to duplicate by name, so the
  # generated case needs `unique_json`. Declared per route, never matched by path.
  - prefix: /platform/billable-metrics
    auth: jwt
    require_environment_header: true
    catalog_unique: true
  - prefix: /platform/entitlements/feature-keys
    auth: jwt
    require_environment_header: true
    catalog_unique: true
  - prefix: /platform/entitlements/plans
    auth: jwt
    require_environment_header: true
    catalog_unique: true

budgets:
  fast:
    budget: 50
    fail: 1500
  default:
    budget: 1500
    fail: 1500
  long:
    budget: 8000
    fail: 8000

errors:
  envelope: spring
  product_packages:
    - com.example
  redact:
    - "test_key_*"
    - "live_key_*"

trace:
  header: X-Trace-Id
  prefix: "heimdall-"

log_sources:
  - id: web
    path: web.log
    role: sync
  - id: worker
    path: worker.log
    role: async
  # The third service is declared and, in this fixture, not instrumented: the tests
  # run no admin JVM, so the trace never reaches `admin.log`. Saying so with
  # `propagate: false` is the difference between a declared absence and a missing
  # line — the packs must not fail a project for the first one.
  - id: admin
    path: admin.log
    role: sync
    propagate: false

targets:
  admin:
    base_url: http://127.0.0.1:9090

request_source:
  kind: bru
  collection: bru

fixtures:
  locale: pt_BR
  email_domain: qa.example.dev
  generators:
    cpf:
      kind: validate_docbr_cpf
    cnpj:
      kind: validate_docbr_cnpj
  field_kinds:
    document_number: cnpj

contract:
  source: openapi
  location: http://127.0.0.1:8080/v3/api-docs
