endpoint: POST /api/ingest
dto: com.example.domain.metering.ingest.dto.IngestRequest
auth: api_key
idempotency: header_uuid_v4
dedup: transaction_id
async: worker
baseline: baselines/ingest-sum.json
fields:
  transaction_id:
    required: true
    json: transaction_id
    max_length: 128
    pattern: "^[A-Za-z0-9._:-]+$"
  customer_id:
    required: true
    json: customer_id
    max_length: 128
  event_type:
    required: true
    json: event_type
    max_length: 64
    pattern: "^[a-z][a-z0-9_]*$"
  timestamp:
    required: true
    json: timestamp
    window:
      future_minutes: 5
      past_hours: 48
  properties:
    required: true
    json: properties
    flat: true
    max_keys: 32
    denylist:
      - cpf
      - cnpj
      - cpf_cnpj
      - ssn
      - passport
      - biometric
      - face_id
      - geolocation
      - lat
      - lon
      - latitude
      - longitude
      - precise_location
rules:
  - id: UNKNOWN_EVENT_TYPE
    status: 422
    code: UNKNOWN_EVENT_TYPE
  - id: MISSING_PROPERTY
    when: "SUM, MAX or UNIQUE and path field absent or non-numeric"
    status: 422
    code: MISSING_PROPERTY
  - id: UNKNOWN_CUSTOMER
    status: 404
    error: User not found
live_only_rules: []
p_gaps:
  - P-GAP-6
  - P-GAP-7
