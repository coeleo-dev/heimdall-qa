id: values-10m-7i
catalog:
  event_type: llm_tokens
  property_path: properties.tokens
  unit_amount: "0.00003"
  flat_amount: "0"
  pricing_model: FLAT
steps:
  - probe_begin: values-10m-7i
  - loop:
      times: 10
      case: cases/metering/metering-H01.yaml
      generate:
        idempotency_key: uuid_v4
  - loop:
      times: 7
      case: cases/ingest/ingest-H01.yaml
      generate:
        transaction_id: uuid
        idempotency_key: uuid_v4
        timestamp: now_iso
      after_each:
        poll:
          get: /api/ingest/{{transaction_id}}
          until_jsonpath: $.quantities[0].rating.status
          until_not: PENDING
          timeout_ms: 8000
  - probe:
      id: values-10m-7i
      oracle:
        catalog: session
        metering: body_amount
        ingest: flat_session
      surfaces:
        - id: wallet
          get: /api/users/{{external_user_id}}/balance
          jsonpath: $.balance
          expect: exact
        - id: customer_tx
          get: /platform/tenants/users/{{nokr_user_id}}/transactions
          jsonpath: $.page.total_elements
          expect: increase
          timeout_ms: 8000
        - id: customer_metrics
          get: /platform/tenants/users/{{nokr_user_id}}/metrics
          jsonpath: $.total_billed_lifetime
          expect: exact
          timeout_ms: 8000
        - id: overview
          get: /platform/dashboard/metrics
          jsonpath: $.conversion.test_drive_consumed_percent
          expect: increase
          timeout_ms: 30000
        - id: cashout
          get: /platform/tenants/cashout/limits
          jsonpath: $.max_withdrawal
          expect: unchanged
      exclude:
        - http_402
        - ingest_insufficient
        - replay
        - http_429
