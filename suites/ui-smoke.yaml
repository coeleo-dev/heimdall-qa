id: ui-smoke
# E2 demonstration surface: no loop, no probe, only browser steps (A.19).
# `page_ms` and the rest of the browser policy live in config.yaml under `ui:`.
#
# Each step must trigger its own load, because `wait_for` is matched against a
# response carrying *that step's* trace id (that is what makes the correlation
# airtight). The login always lands on /overview, so step 1 owns that read; step 2
# navigates in-app to a second money screen, which also proves the session
# survives an in-app navigation (A.19 / R17) — a `page.goto` there would lose the
# in-memory JWT.
catalog:
  pricing_model: FLAT
steps:
  # `path: /auth/login` means "authenticate": the screen read is where the guard
  # drops the session (/overview), which the step's artifacts show.
  #
  # `baseline` is what turns `ui.structure` into a gate. It is resolved against
  # the run root and compared as a *subset*: the template fails by what it
  # declares, not by what it omits. Volatile leaves (money, counts, the tenant
  # name) are masked with `/.*/`, because comparing them here would duplicate
  # `ui.value` (E4) against the wrong source.
  - ui:
      id: login
      path: /auth/login
      wait_for: /platform/dashboard/metrics
      baseline: baselines/ui/overview.aria.yml
  # The metrics tab is deliberate: its surfaces are tenant-wide aggregates, so
  # they carry a value even in an empty environment, whereas the ledger tab's row
  # surfaces only render when a customer exists.
  #
  # No `baseline` here yet: `ui.structure` reports `skipped` with a hint instead
  # of a green it never earned. E5 commits the remaining screens' templates.
  # No `waive` either — `ui.visual` already reports `skipped` (pixel diff is out
  # of scope in v1), and a waive on a pack that cannot fail is dead config.
  - ui:
      id: customers
      path: /customers?tab=metrics
      wait_for: /platform/tenants/users/summary
