id: piloto-ingest
catalog:
  event_type: llm_tokens
  aggregation_function: SUM
  property_path: properties.tokens
prerequisites:
  - secrets.local.yaml api_key with nk_test_ prefix
  - customer_id {{external_user_id}} from api-users-post-H01
  - rating_engine_dimensional enabled
  - web and worker JVMs with profiles web and worker (file logs: logback web + application-worker.yml)
notes: B-max-event_type expects 422 UNKNOWN_EVENT_TYPE because a 64-char slug is not in the
  session catalog. B-max-customer_id expects 404 because a 128-char id is not the captured user.
  Worker SKIP only if the worker JVM is down.
