[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nokr-qa"
version = "0.1.0"
description = "Review harness for the NokrAPI HTTP surface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",
    "faker>=30",
    "validate-docbr>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nokr-qa = "nokr_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nokr_qa = ["serve/templates/*.html", "serve/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: hits localhost NokrAPI; skipped unless NOKR_QA_SLOW=1",
]
