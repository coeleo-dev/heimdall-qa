# Copy to `secrets.local.yaml`, which is gitignored. Names here are the *harness's*
# vocabulary, not a product's: a case refers to a secret by name and the project's own
# descriptor says which header carries it. A product that needs another name adds it
# to its own example — this file ships with the core and stays generic.
api_key: replace-with-the-project-api-key
jwt: replace-with-the-project-jwt
admin_secret: replace-with-the-admin-secret
email: replace-with-a-login-email
password: replace-with-a-login-password
refresh_token: replace-with-a-refresh-token
external_user_id: replace-with-an-external-user-id
