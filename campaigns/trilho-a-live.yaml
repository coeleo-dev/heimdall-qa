id: trilho-a-live
environment: production
exclude:
  kinds:
    - D
  sections:
    - A5
    - A6
  notes: >-
    Go-Live and P-live HTTP from the Trilho A matrix §14. Kind D, A5, and A6
    stay out. Swap secrets.local.yaml to nk_live_ / production JWT before review.
    Do not mix rounds/values-10m-7i.yaml. Sandbox A0–A4 stays in trilho-a-http.
rounds:
  - round: rounds/live-auth-register-other.yaml
    endpoint: POST /auth/register
    dto: com.nokr.domain.auth.dto.RegisterRequest
    matrix: LIVE
    auth: none
    notes: Second tenant for OTHER_TENANT. Capture other_api_key only.
  - round: rounds/platform-tenants-activate.yaml
    endpoint: POST /platform/tenants/activate
    dto: com.nokr.domain.tenant.dto.ActivateProductionRequest
    matrix: LIVE
    auth: jwt
  - round: rounds/live-platform-api-keys-post.yaml
    endpoint: POST /platform/api-keys
    dto: com.nokr.domain.auth.dto.CreateApiKeyRequest
    matrix: LIVE
    auth: jwt
    notes: TA-A1-P01 / P02 production keys after Go-Live.
  - round: rounds/live-platform-api-keys-get.yaml
    endpoint: GET /platform/api-keys
    dto: com.nokr.domain.auth.controller.B2BApiKeyController
    matrix: LIVE
    auth: jwt
  - round: rounds/live-platform-webhooks-post.yaml
    endpoint: POST /platform/webhooks
    dto: com.nokr.domain.notification.outbound.dto.CreateWebhookRequest
    matrix: LIVE
    auth: jwt
    notes: TA-A1-P03 HTTPS required.
  - round: rounds/live-platform-webhooks-patch.yaml
    endpoint: PATCH /platform/webhooks/{webhookId}
    dto: com.nokr.domain.notification.outbound.dto.UpdateWebhookRequest
    matrix: LIVE
    auth: jwt
    notes: TA-A1-P04.
  - round: rounds/live-platform-tenants-settings.yaml
    endpoint: PATCH /platform/tenants/settings
    dto: com.nokr.domain.tenant.dto.TenantSettingsRequest
    matrix: LIVE
    auth: jwt
    notes: TA-LIVE-P03 test-drive pair independent of sandbox.
  - round: rounds/live-platform-billable-metrics-post.yaml
    endpoint: POST /platform/billable-metrics
    dto: com.nokr.domain.metering.catalog.dto.CreateBillableMetricRequest
    matrix: LIVE
    auth: jwt
  - round: rounds/live-platform-rate-cards-post.yaml
    endpoint: POST /platform/rate-cards
    dto: com.nokr.domain.metering.rating.dto.CreateRateCardRequest
    matrix: LIVE
    auth: jwt
    notes: TA-A2-P04 / P05 CDC notice period.
  - round: rounds/live-platform-feature-keys-post.yaml
    endpoint: POST /platform/entitlements/feature-keys
    dto: com.nokr.domain.entitlements.dto.CreateFeatureKeyRequest
    matrix: LIVE
    auth: jwt
  - round: rounds/live-platform-plans-post.yaml
    endpoint: POST /platform/entitlements/plans
    dto: com.nokr.domain.entitlements.dto.B2BPlanRequest
    matrix: LIVE
    auth: jwt
  - round: rounds/live-api-users-post.yaml
    endpoint: POST /api/users
    dto: com.nokr.domain.user.dto.CreateUserCommand
    matrix: LIVE
    auth: api_key
  - round: rounds/live-api-users-get.yaml
    endpoint: GET /api/users/{externalUserId}
    dto: com.nokr.domain.user.controller.UserController
    matrix: LIVE
    auth: api_key
  - round: rounds/live-api-users-balance.yaml
    endpoint: GET /api/users/{externalUserId}/balance
    dto: com.nokr.domain.user.controller.UserController
    matrix: LIVE
    auth: api_key
  - round: rounds/live-api-entitlements-check.yaml
    endpoint: POST /api/entitlements/check
    dto: com.nokr.domain.entitlements.dto.EntitlementCheckRequest
    matrix: LIVE
    auth: api_key
  - round: rounds/live-api-entitlements-check-bulk.yaml
    endpoint: POST /api/entitlements/check/bulk
    dto: com.nokr.domain.entitlements.dto.EntitlementBulkCheckRequest
    matrix: LIVE
    auth: api_key
  - round: rounds/live-api-metering.yaml
    endpoint: POST /api/metering
    dto: com.nokr.domain.metering.human.dto.MeteringRequest
    matrix: LIVE
    auth: api_key
  - round: rounds/live-api-ingest.yaml
    endpoint: POST /api/ingest
    dto: com.nokr.domain.metering.ingest.dto.IngestRequest
    matrix: LIVE
    auth: api_key
    notes: Replay ingest on nk_live_. TA-LIVE-P05 is N-rule UNKNOWN_EVENT_TYPE without live metric.
  - round: rounds/live-api-ingest-get.yaml
    endpoint: GET /api/ingest/{transactionId}
    dto: com.nokr.domain.metering.ingest.controller.IngestController
    matrix: LIVE
    auth: api_key
  - round: rounds/live-api-simulate-cash-in.yaml
    endpoint: POST /api/sandbox/simulate-cash-in
    dto: com.nokr.domain.sandbox.simulation.controller.SandboxSimulationController
    matrix: LIVE
    auth: api_key
    notes: TA-A4-P06 / P-GAP-1 — do not mark product fail if sandbox Redis is credited.
  - round: rounds/live-api-settlement-cash-in.yaml
    endpoint: POST /api/settlement/cash-in
    dto: com.nokr.domain.settlement.cashin.dto.DepositIntentRequest
    matrix: LIVE
    auth: api_key
