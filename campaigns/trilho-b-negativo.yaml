id: trilho-b-negativo
environment: sandbox
exclude:
  kinds: []
  sections: []
  notes: >-
    Trilho B — Negativo, BOLA/IDOR, Fuzzing, Matemática Fiduciária,
    Isolamento de Namespace e Kill-Switch Destrutivo.
rounds:
  - round: rounds/trilho-b/trilho-b-setup.yaml
    endpoint: POST /setup/multi-tenant
    dto: com.nokr.domain.tenant.SetupMultiTenant
    matrix: B
    auth: none
    notes: Provisiona Tenant A e Tenant B, usuários, métricas e saldo inicial
  - round: rounds/trilho-b/trilho-b-bola.yaml
    endpoint: POST /security/bola-cross-tenant
    dto: com.nokr.domain.security.BolaVerification
    matrix: B1
    auth: api_key
    notes: Bloco 1 — BOLA / IDOR cross-tenant com IDs reais
  - round: rounds/trilho-b/trilho-b-auth.yaml
    endpoint: POST /security/auth-tokens
    dto: com.nokr.domain.security.AuthVerification
    matrix: B2
    auth: none
    notes: Bloco 2 — Autenticação, tokens e superfície
  - round: rounds/trilho-b/trilho-b-fuzzing.yaml
    endpoint: POST /security/fuzzing-injection
    dto: com.nokr.domain.security.FuzzingVerification
    matrix: B3
    auth: api_key
    notes: Bloco 3 — Fuzzing, SQLi, XSS e denylist PII
  - round: rounds/trilho-b/trilho-b-math.yaml
    endpoint: POST /business/fiduciary-math
    dto: com.nokr.domain.metering.FiduciaryMathVerification
    matrix: B4
    auth: api_key
    notes: Bloco 4 — Matemática fiduciária, zero, negativos e 402
  - round: rounds/trilho-b/trilho-b-namespace.yaml
    endpoint: POST /security/namespace-isolation
    dto: com.nokr.domain.security.NamespaceIsolationVerification
    matrix: B5
    auth: api_key
    notes: Bloco 5 — Conflito de ambiente P-GAP-6 e sandbox-only
  - round: rounds/trilho-b/trilho-b-state.yaml
    endpoint: POST /platform/tenants/kill-switch
    dto: com.nokr.domain.tenant.dto.KillSwitchRequest
    matrix: B6
    auth: jwt
    notes: Bloco 6 — Idempotência e Kill-Switch no Tenant B
